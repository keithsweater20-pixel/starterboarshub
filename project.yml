name: StarterBoardHub
options:
  bundleIdPrefix: com.keithsweater20pixel
  deploymentTarget:
    iOS: "17.0"
targets:
  StarterBoardHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithsweater20pixel.starterboardhub
        PRODUCT_NAME: StarterBoardHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "StarterBoard Hub"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
