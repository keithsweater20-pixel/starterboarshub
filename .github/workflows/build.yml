name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project StarterBoardHub.xcodeproj \
            -scheme StarterBoardHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/StarterBoardHub.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r StarterBoardHub-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarterBoardHub-unsigned-IPA
          path: StarterBoardHub-unsigned.ipa
          if-no-files-found: error
